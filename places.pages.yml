# The configuration the published page is built from.
#
# The page that is published is built in GitHub Actions from this file, so it
# holds a smaller set of places and parameters than the local service does.
# The local service reads places.yml, which follows everything.

places:
  - id: gliwice
    name: Gliwice
    latitude: 50.29417
    longitude: 18.66583
    elevation: 230
    timezone: Europe/Warsaw
    country: Poland
    country_code: PL
    flag: 🇵🇱
    note: City centre, on the Kłodnica river

  - id: gorki-wielkie
    name: Górki Wielkie
    latitude: 49.77281
    longitude: 18.85401
    elevation: 328
    timezone: Europe/Warsaw
    country: Poland
    country_code: PL
    flag: 🇵🇱
    note: Village in gmina Brenna, Cieszyn County, Beskids

# A capital or a major city from each of these countries, plus the peaks.
catalogue: [
  gdansk, berlin, lyon, ben-nevis, barcelona, florence, amsterdam, gothenburg,
  helsinki, bern, innsbruck, brno, chicago, calgary, fukuoka, brisbane,
  brasilia-2, bangalore, cape-town, abu-dhabi, reykjavik, athens, budapest,
  brasov, kyiv, aconcagua, mount-kosciuszko, mont-blanc, zugspitze, mount-fuji,
  mount-everest, k2, giewont, rysy, sniezka, matterhorn, monte-rosa,
  mount-kilimanjaro, denali,
]

# The surface parameters that are worth having. Every parameter is a full
# global field, so each one costs about 1.8 MB per step at 0.1 degrees.
parameters: [2t, 2d, msl, 10u, 10v, 10fg, tcc, tp, sf, sd, asn, mucape]
pressure_levels: []

# Every six hours for the first three days, then every twelve hours to a
# week, then once a day.
steps: [0, 6, 12, 18, 24, 30, 36, 42, 48, 54, 60, 66, 72,
        84, 96, 108, 120, 132, 144,
        168, 192, 216, 240, 288, 336, 360]

# The models the page offers. The 0.25 degree IFS is left out, it is the same
# forecast as the 0.1 degree one and takes another gigabyte to fetch.
models: [ifs, aifs]

source: ecmwf
fallback_sources: [aws, google]
poll_interval: 900

# Only the newest run is fetched, and only that one is kept.
backfill_runs: 1
keep_runs: 1

# A separate database, so the published page and the local service do not
# share one.
database: data/pages/forecast.sqlite
cache_dir: data/pages/grib
