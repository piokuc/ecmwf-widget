name: Test

# The tests run on every push and on every pull request: the unit tests
# and the scenarios of the published page, on macOS and on Linux, on every
# version of Python the package supports.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
        python: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install the package and the tools of the tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint the code
        run: python -m ruff check src tests

      - name: Install test browsers
        env:
          PLAYWRIGHT_BROWSERS_PATH: .playwright
        run: python -m playwright install --with-deps chromium webkit

      - name: Run the tests
        run: python -m pytest

      - name: Check that the package can be built and installed
        if: matrix.python == '3.12'
        run: |
          python -m build
          python -m pip install --upgrade twine
          python -m twine check dist/*
          python -m pip install --force-reinstall dist/*.whl
          ecmwf-service --help
          ecmwf-download --help
