name: Build the packages

# A wheel and an sdist (pure Python, every OS), and a portable bundle per
# platform: the ingestor, the local widget, the site builder and the
# publishing daemon with their dependencies already installed inside.
#
# Every push of a tag `v*`, or a run from the Actions tab, builds the
# packages and uploads them as artifacts; a tag also gets them attached
# to the release marked by it.

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install the package and the tools of the tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Install test browsers
        env:
          PLAYWRIGHT_BROWSERS_PATH: .playwright
        run: python -m playwright install --with-deps chromium webkit

      - name: Run the tests
        run: python -m pytest

      - name: Build the wheel and the sdist
        run: |
          python -m pip install --quiet build twine
          python -m build
          python -m twine check dist/*

      - name: Check that the package carries its files
        run: |
          python - <<'PY'
          import glob
          import zipfile

          wheel = glob.glob("dist/*.whl")[0]
          with zipfile.ZipFile(wheel) as archive:
              names = archive.namelist()
          for wanted in (
              "ecmwf_widget/data/world_places.yml",
              "ecmwf_widget/data/places.yml",
              "ecmwf_widget/assets/icons/sun.png",
              "ecmwf_widget/assets/app-icon-192.png",
          ):
              assert wanted in names, f"{wanted} is not in the wheel"
          print("the wheel carries the catalogue, the icons and the configuration")
          PY

      - name: Install the wheel and try it
        run: |
          python -m venv .venv-wheel
          .venv-wheel/bin/python -m pip install --upgrade pip
          .venv-wheel/bin/python -m pip install dist/*.whl
          # the ingestor answers, without touching the network
          .venv-wheel/bin/ecmwf-service status
          .venv-wheel/bin/ecmwf-download --help >/dev/null
          .venv-wheel/bin/ecmwf-widget --help >/dev/null

      - name: Assemble the portable bundle
        run: sh scripts/make_bundle.sh

      - name: Smoke test the bundle
        run: |
          set -euo pipefail
          # The bundle is a tar.gz too, so it has to be named exactly.
          ARCHIVE=$(printf '%s\n' dist/ecmwf-widget-*.tar.gz)
          STAGE=$(basename "$ARCHIVE" .tar.gz)
          tar -xzf "$ARCHIVE"
          chmod +x "$STAGE/bin/"*
          # the ingestor answers, without touching the network
          "$STAGE/bin/ecmwf-service" status
          ./"$STAGE/bin/ecmwf-download" --help >/dev/null
        shell: bash

      - name: Upload the artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          path: |
            dist/*.tar.gz
            dist/*.whl
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
