name: Publish the forecast

# The page is built here rather than on the laptop, so the repository does
# not fill up with a copy of the forecast on every run.
#
# The schedule is a quarter past the ECMWF cycles, with an hour and ten
# minutes of slack for the 0.1 degree tier to arrive.

on:
  schedule:
    - cron: "50 1,7,13,19 * * *"
  workflow_dispatch:
    inputs:
      place:
        description: Which place to build the page for
        required: false
        default: gliwice

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install the package
        run: |
          python -m pip install --upgrade pip
          python -m pip install .

      - name: Wait for the forecast data, then fetch it
        run: |
          python - <<'PY'
          import datetime as dt
          import subprocess
          import sys

          from ecmwf_widget.scheduler import DEFAULT_DELAY, next_expected

          expected = next_expected(dt.datetime.now(dt.timezone.utc), DEFAULT_DELAY)
          wait_seconds = (expected + dt.timedelta(minutes=1) - dt.datetime.now(dt.timezone.utc)).total_seconds()
          if wait_seconds > 0:
              print(f"waiting {wait_seconds / 60:.0f} minutes for the run {expected} to become available")
              subprocess.run(["sleep", str(int(wait_seconds))], check=True)
          raise SystemExit(
              subprocess.run(
                  [sys.executable, "-u", "-m", "ecmwf_widget.service", "once", "--config", "config/places.pages.yml"],
                  check=False,
              ).returncode
          )
          PY

      - name: Build the page
        run: |
          python -m ecmwf_widget.build_site --config config/places.pages.yml --out site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
